services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cargolane
      POSTGRES_PASSWORD: cargolane
      POSTGRES_DB: cargolane
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargolane"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports: ["27017:27017"]

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
    ports: ["4566:4566"]
